<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropIt — Fichiers en transit</title>
  <meta name="description" content="Envoi de gros fichiers jusqu'à 40 Go, relié au SSO. Liens courts, durée de vie, récupérables 24 h après suppression.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='3' fill='%23121216' stroke='%232c2c35'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%23ff6a1f' opacity='0.9'/%3E%3C/svg%3E">
</head>
<body>
  <!--
  DROPIT world contract (seed 9a751a58 → challenger signals-instruments-nixie-laboratory-counter)
  THESIS: a file-transfer labouratory counted in neon glass — every quantity a tube bank, every status a lamp state; it refuses the "progress bar into a folder" file-sharing default.
  OWN-WORLD: blackened steel chassis, hairline metal rules, engraved caps, one neon-orange accent that is the only warm thing; IBM Plex Mono digits glow inside glass envelopes with ghost numerals behind.
  STORY: the operator sees each deposit's time-to-live as a physical counter, reads its state from the lamp, and acts (copy / regenerate / delete / restore) without a modal.
  FIRST VIEWPORT: chassis bar with lit DROP·IT tube; brand navigation; "Partages" list of husbanded slots, the lead metric a live expiration bank, recovery state shown as an offened tube with restore lever.
  FORM: laboratory-nixie instrument, challenger 4, seed key 9a751a58.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
  -->
  <div class="app-shell">
    <header class="chassis-bar">
      <div class="brand">
        <span>DROP</span><span class="brand-tube" role="img" aria-label="i"></span><span>IT</span>
      </div>

      <nav class="chassis-nav" id="nav" aria-label="Navigation principale">
        <button data-view="dashboard" aria-current="true">Partages</button>
        <button data-view="upload">Nouvel envoi</button>
      </nav>

      <div class="chassis-user">
        <span class="avatar" id="userAvatar" aria-hidden="true"></span>
        <span id="userName"></span>
        <a class="logout" href="/auth/logout">Quitter</a>
      </div>
    </header>

    <main class="container">
      <!-- DASHBOARD -->
      <section id="view-dashboard" class="view" hidden>
        <div class="page-head">
          <div>
            <h1>Partages</h1>
            <div class="sub">État de chaque dépôt, temps restant, récupération après suppression.</div>
          </div>
        </div>
        <div id="shareList" aria-live="polite"></div>
      </section>

      <!-- UPLOAD -->
      <section id="view-upload" class="view" hidden>
        <div class="page-head">
          <div>
            <h1>Nouvel envoi</h1>
            <div class="sub">Les fichiers partent en chunks : l'envoi reprend après une coupure.</div>
          </div>
        </div>

        <div id="uploadFlow">
          <div class="drop-vault" id="dropZone" tabindex="0" role="button" aria-label="Sélectionner des fichiers à envoyer">
            <div class="vault-tube tube" id="vaultTube"
                 style="--tube-h:64px"><span class="tube-window"></span><span class="tube-ghost" aria-hidden="true"></span><span class="tube-lit">0</span></div>
            <h2>Déposez vos fichiers ici</h2>
            <p>Jusqu'à 40 Go par fichier. Plusieurs fichiers d'un coup.</p>
            <div class="drop-cta">
              <button class="btn btn-primary" id="pickBtn" type="button">Choisir des fichiers</button>
            </div>
            <input type="file" id="fileInput" multiple aria-label="Fichiers à envoyer">
          </div>

          <div id="queueWrap" hidden>
            <div class="waiting" id="queue" aria-live="polite"></div>

            <div class="form-panel">
              <div class="form-label">Durée de partage</div>
              <div class="duration-set" id="durations" role="group" aria-label="Durée du partage">
                <button class="duration-key" data-duration="1h">1 h</button>
                <button class="duration-key" aria-pressed="true" data-duration="24h">24 h<span class="duration-dot" aria-hidden="true"></span></button>
                <button class="duration-key" data-duration="7d">7 j</button>
                <button class="duration-key" data-duration="30d">30 j</button>
              </div>

              <div class="form-actions">
                <span class="cap" id="queueSummary"></span>
                <button class="btn btn-primary" id="sendBtn" type="button" disabled>
                  <span class="btn-icon" aria-hidden="true">▲</span> Déposer le partage
                </button>
              </div>
            </div>
          </div>

          <div class="created-card" id="createdCard" hidden>
            <div class="cap" style="color:var(--accent-bright)">Partage déposé</div>
            <div class="created-url" id="createdUrl"></div>
            <div class="created-actions">
              <button class="btn btn-primary" id="copyCreated" type="button">Copier le lien</button>
              <button class="btn" id="resetCreated" type="button">Nouvel envoi</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
